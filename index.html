<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <title>西班牙之旅｜旅遊分帳</title>
  <style>
    :root{--bg:#fff9ee;--card:#fff;--ink:#34211d;--muted:#796763;--accent:#bd2433;--accent2:#e4a819;--danger:#c33235;--line:#eee0d5;--good:#22815a;--shadow:0 12px 36px rgba(105,50,32,.09)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff5ed,#fff9dd 48%,#fff5f1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:34px 18px 60px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.hero h1{display:flex;align-items:center;gap:12px;font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:-1.5px}.hero p{margin:8px 0 0;color:var(--muted)}.spain-flag{width:46px;height:32px;border-radius:5px;box-shadow:0 2px 8px rgba(75,34,24,.18);flex:none}
    .grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.stack{display:grid;gap:20px}.card{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}h2{font-size:17px;margin:0 0 16px}.row{display:flex;gap:10px}.field{display:grid;gap:6px;margin-bottom:12px;flex:1}label{font-size:13px;font-weight:650;color:#4e586e}input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;font:inherit;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,88,211,.12)}button{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}button:hover{filter:brightness(.96)}button.secondary{background:#eef0f6;color:#3c465c}button.danger{background:#fff0f0;color:var(--danger)}button.small{padding:7px 10px;font-size:13px}.people{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#f0effd;font-size:14px}.chip button{padding:0;background:none;color:#746d91;font-size:18px;line-height:1}
    .checks{display:flex;flex-wrap:wrap;gap:8px}.check{position:relative}.check input{position:absolute;opacity:0}.check span{display:block;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);cursor:pointer;font-size:14px}.check input:checked+span{border-color:var(--accent);background:#eeecff;color:var(--accent);font-weight:700}.expense{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.expense:last-child{border:0}.expense strong{display:block}.meta{font-size:13px;color:var(--muted);margin-top:4px}.amount{font-weight:800;text-align:right}.amount button{display:block;margin:5px 0 0 auto}.empty{text-align:center;padding:28px 10px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.balance{padding:14px;background:#f7f8fc;border-radius:14px}.balance .num{font-size:20px;font-weight:850;margin-top:5px}.positive{color:var(--good)}.negative{color:var(--danger)}.transfer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.transfer:last-child{border:0}.arrow{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.total{font-size:13px;color:var(--muted);font-weight:650}.total b{font-size:18px;color:var(--ink)}
    .entry-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:5px;margin-bottom:19px;background:#f0f1f7;border-radius:13px}.entry-tab{padding:10px 5px;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;white-space:nowrap}.entry-tab[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 7px rgba(30,40,70,.08)}.people-panel .people{margin-top:15px;display:grid}.person-card{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;background:#f7f8fc;border-radius:12px}.person-note{margin-top:4px;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:14px;background:#f7f8fc;border-radius:14px}.stat-label{font-size:13px;color:var(--muted)}.stat-value{font-size:20px;font-weight:850;margin-top:6px;overflow-wrap:anywhere}.stat-sub{font-size:12px;color:var(--muted);margin-top:5px}.person-breakdown{display:grid;gap:4px;margin-top:8px;font-size:13px;color:var(--muted)}.category-badge{display:inline-block;margin-right:7px;padding:3px 8px;border-radius:999px;background:#eeecff;color:var(--accent);font-size:12px;font-weight:700}.category-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.category-row:last-child{border-bottom:0}[hidden]{display:none!important}.custom-splits{display:grid;gap:9px;margin-top:4px}.custom-row{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px}.custom-row span{font-size:14px}.split-status{font-size:13px;margin-top:8px;color:var(--muted)}.split-status.invalid{color:var(--danger)}.split-status.valid{color:var(--good)}.split-detail{margin-top:7px;line-height:1.7}
    .entry-tabs{background:#fff1d0}.entry-tab[aria-selected="true"]{background:#fffaf0}.check input:checked+span,.category-badge{background:#fff0d1}.person-card,.stat,.balance{background:#fff8ed}button.secondary{background:#fff0cf;color:#795117}.settlement-screen{position:fixed;inset:0;z-index:20;overflow:auto;background:linear-gradient(145deg,#bd2433 0%,#d52b36 25%,#ffc843 25%,#ffc843 75%,#bd2433 75%,#a91d2a 100%);padding:42px 18px}.settlement-dialog{max-width:760px;margin:5vh auto;background:rgba(255,253,248,.98);border-radius:24px;padding:30px;box-shadow:0 20px 80px rgba(65,19,15,.3)}.settlement-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.settlement-heading h2{margin:0;font-size:26px}.settlement-intro{color:var(--muted);margin:0 0 24px}.settlement-dialog .transfer{padding:18px 0;font-size:17px}.settlement-dialog .transfer strong{color:var(--accent);font-size:20px}.person-balance{width:100%;border:1px solid transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .18s,border-color .18s,box-shadow .18s}.person-balance:hover,.person-balance:focus-visible{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 22px rgba(121,81,23,.18)}.detail-hint{margin-top:10px;color:var(--accent);font-size:13px;font-weight:750}.detail-entry{padding:16px 0;border-bottom:1px solid var(--line)}.detail-entry:last-child{border:0}.detail-entry-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.detail-money{font-weight:800;text-align:right;white-space:nowrap}.detail-summary{margin-bottom:18px}
    .stats-grid{grid-template-columns:1fr}.stat-value{font-size:30px}.payer-rows{display:grid;gap:9px}.payer-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,115px) auto;gap:7px;align-items:center}.payer-row.single-payer{grid-template-columns:1fr}.payer-row .small{padding:8px}.chart-layout{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.donut-chart{position:relative;width:170px;height:170px;margin:auto;border-radius:50%;background:var(--chart-background,#eee)}.donut-chart::after{content:"";position:absolute;inset:32px;background:#fff;border-radius:50%}.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;font-size:13px;color:var(--muted)}.donut-center strong{font-size:18px;color:var(--ink)}.chart-legend{display:grid;gap:11px}.legend-row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px}.legend-dot{width:11px;height:11px;border-radius:50%}.category-chart-row{padding:10px 0;border-bottom:1px solid var(--line)}.category-chart-row:last-child{border:0}.category-chart-label{display:flex;justify-content:space-between;gap:8px;font-size:14px}.chart-track{height:9px;margin-top:8px;border-radius:999px;background:#f6e9dc;overflow:hidden}.chart-bar{height:100%;border-radius:999px}
    @media(max-width:780px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.row{flex-direction:column}.wrap{padding-top:24px}.card{border-radius:16px}.stats-grid{grid-template-columns:1fr}.settlement-screen{padding:18px 12px}.settlement-dialog{padding:20px;margin:9vh auto}.settlement-heading h2{font-size:21px}.chart-layout{grid-template-columns:1fr}.payer-row{grid-template-columns:minmax(0,1fr) minmax(0,100px) auto}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="hero"><div><h1>西班牙之旅 <svg class="spain-flag" viewBox="0 0 60 40" role="img" aria-label="西班牙國旗"><rect width="60" height="40" fill="#c60b1e"/><rect y="10" width="60" height="20" fill="#ffc400"/><path d="M17 15h8v9c0 3-2 5-4 6-2-1-4-3-4-6z" fill="#c60b1e"/><path d="M19 14h4v2h-4z" fill="#a47b14"/></svg></h1><p>多人共用旅遊帳本 · <span id="syncStatus">正在連線…</span></p></div><div class="toolbar"><button id="calculateBtn">最終結算</button><button class="secondary" id="openChartsBtn">旅程統計圖表</button><button class="secondary" id="exportStatsBtn">匯出旅程統計</button></div></header>
  <div class="grid">
    <section class="stack">
      <div class="card"><h2>新增紀錄</h2><div class="entry-tabs" role="tablist" aria-label="新增紀錄類型"><button type="button" class="entry-tab" id="peopleTab" role="tab" aria-selected="false" aria-controls="peoplePanel">新增旅伴</button><button type="button" class="entry-tab" id="expenseTab" role="tab" aria-selected="true" aria-controls="expenseForm">新增支出</button><button type="button" class="entry-tab" id="incomeTab" role="tab" aria-selected="false" aria-controls="incomeForm">新增收入</button></div>
      <div class="people-panel" id="peoplePanel" role="tabpanel" aria-labelledby="peopleTab" hidden><form id="personForm"><div class="field"><label for="personName">旅客姓名</label><input id="personName" maxlength="20" placeholder="輸入姓名" required></div><div class="field"><label for="personNote">旅客備註</label><input id="personNote" maxlength="120" placeholder="例如：房型、飲食需求、聯絡資訊"></div><button type="submit" style="width:100%">新增旅伴</button></form><div class="people" id="people"></div></div>
      <form id="incomeForm" role="tabpanel" aria-labelledby="incomeTab" hidden>
        <div class="field"><label for="incomeTitle">收入項目</label><input id="incomeTitle" maxlength="40" placeholder="例如：公司旅遊補助" required></div>
        <div class="field"><label for="incomeAmount">補助金額</label><input id="incomeAmount" type="text" inputmode="decimal" placeholder="0" required></div>
        <div class="row"><div class="field"><label for="beneficiary">補助屬於誰</label><select id="beneficiary" required></select></div><div class="field"><label for="holder">由誰收款／保管</label><select id="holder" required></select></div></div>
        <button type="submit" style="width:100%">加入收入</button>
      </form><form id="expenseForm" role="tabpanel" aria-labelledby="expenseTab">
        <div class="field"><label for="title">項目</label><input id="title" maxlength="40" placeholder="例如：晚餐" required></div>
        <div class="field"><label for="expenseCategory">支出分類</label><div class="row"><select id="expenseCategory"></select><button type="button" class="secondary small" id="addCategoryBtn" style="white-space:nowrap">＋ 新增分類</button></div></div>
        <div class="field"><label for="amount">支出總金額</label><input id="amount" type="text" inputmode="decimal" placeholder="0" required></div>
        <div class="field"><label>付款人與各自付款金額</label><div class="payer-rows" id="payerRows"></div><button type="button" class="secondary small" id="addPayerBtn">＋ 新增付款人</button><div class="split-status" id="payerStatus"></div></div>
        <div class="field"><label>參與分攤的人，可以取消不參與者</label><div class="checks" id="splitPeople"></div></div>
        <div class="field"><label for="splitMode">分攤方式</label><select id="splitMode"><option value="equal">平均分攤</option><option value="custom">自訂每人金額</option></select></div>
        <div class="field" id="customSplitField" hidden><label>每人應付金額</label><div class="custom-splits" id="customSplits"></div><div class="split-status" id="splitStatus"></div></div>
        <button type="submit" style="width:100%">加入支出</button>
      </form></div>
    </section>
    <section class="stack">
      <div class="card"><h2>旅費總覽</h2><div class="stats-grid" id="tripStats"></div></div>
      <div class="card"><h2>支出分類統計</h2><div id="categoryStats"></div></div>
      <div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><h2>支出明細</h2><div class="total">總支出　<b id="grandTotal">$0</b></div></div><div id="expenses"></div></div>
      <div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><h2>收入／補助明細</h2><div class="total">總收入　<b id="incomeTotal">$0</b></div></div><div id="incomes"></div></div>
    </section>
  </div>
</main>
<section class="settlement-screen" id="settlementScreen" role="dialog" aria-modal="true" aria-labelledby="settlementTitle" hidden><div class="settlement-dialog"><div class="settlement-heading"><h2 id="settlementTitle">西班牙之旅・最終結算</h2><button type="button" class="secondary" id="closeSettlementBtn">返回帳本</button></div><p class="settlement-intro">一次查看每位旅伴的旅費明細與最少筆數付款安排。</p><h2>個人旅費結算</h2><div class="summary-grid" id="balances"></div><h2 style="margin-top:28px">最佳付款方式</h2><div id="settlements"></div></div></section>
<section class="settlement-screen" id="chartsScreen" role="dialog" aria-modal="true" aria-labelledby="chartsTitle" hidden><div class="settlement-dialog"><div class="settlement-heading"><h2 id="chartsTitle">西班牙之旅・旅程統計圖表</h2><button type="button" class="secondary" id="closeChartsBtn">返回帳本</button></div><p class="settlement-intro">查看整趟旅程的支出比例與分類花費。</p><div id="tripCharts"></div></div></section>
<section class="settlement-screen" id="editExpenseScreen" role="dialog" aria-modal="true" aria-labelledby="editExpenseHeading" hidden><div class="settlement-dialog"><div class="settlement-heading"><h2 id="editExpenseHeading">編輯支出</h2><button type="button" class="secondary" id="closeEditExpenseBtn">取消</button></div><p class="settlement-intro">修改後會同步更新所有旅伴的帳本與結算結果。</p><form id="editExpenseForm"><div class="field"><label for="editExpenseItem">支出項目</label><input id="editExpenseItem" required></div><div class="field"><label for="editExpenseCategory">支出分類</label><select id="editExpenseCategory"></select></div><div class="field"><label for="editExpenseAmount">支出總金額</label><input id="editExpenseAmount" type="text" inputmode="decimal" required></div><div class="field"><label>付款人</label><div id="editPayerRows"></div><button type="button" class="secondary small" id="editAddPayerBtn">＋ 新增付款人</button><div class="split-status" id="editPayerStatus"></div></div><div class="field"><label>參與分攤的人</label><div class="checks" id="editSplitPeople"></div></div><div class="field"><label for="editSplitMode">分攤方式</label><select id="editSplitMode"><option value="equal">平均分攤</option><option value="custom">自訂每人金額</option></select></div><div class="field" id="editCustomSplitField" hidden><label>每人分攤金額</label><div id="editCustomSplits"></div><div class="split-status" id="editSplitStatus"></div></div><button type="submit">儲存更新</button></form></div></section>
<section class="settlement-screen" id="personDetailScreen" role="dialog" aria-modal="true" aria-labelledby="personDetailTitle" hidden><div class="settlement-dialog"><div class="settlement-heading"><h2 id="personDetailTitle">個人旅費明細</h2><button type="button" class="secondary" id="closePersonDetailBtn">返回結算</button></div><p class="settlement-intro" id="personDetailIntro"></p><div class="summary-grid detail-summary" id="personDetailSummary"></div><h2>支出明細</h2><div id="personExpenseDetails"></div><h2 style="margin-top:28px">收入／補助明細</h2><div id="personIncomeDetails"></div></div></section>
<script src="config.js"></script>
<script>
let state={people:[],expenses:[],incomes:[],categories:[]};
let cloudRevision=0,cloudReady=false,cloudSaving=false,cloudRefreshing=false;
let settlementRequested=false;
let editingExpenseId=null;
const ledgerCacheKey='spain-trip-ledger-cache-v1';
const defaultCategories=['早餐','午餐','晚餐','餐飲','交通','住宿','景點門票','購物','其他'];
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:2}).format(n);
function parseAmount(value){return Number(String(value||'').replace(/,/g,''))}
function formatAmountInput(input){const raw=input.value.replace(/[^\d.]/g,'');if(!raw){input.value='';return}const parts=raw.split('.'),whole=parts[0].replace(/^0+(?=\d)/,'')||'0',decimal=parts.slice(1).join('').slice(0,2);input.value=whole.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(parts.length>1?'.'+decimal:'')}
function syncStatus(message){$('#syncStatus').textContent=message}
function cacheLedger(){try{localStorage.setItem(ledgerCacheKey,JSON.stringify({state,revision:cloudRevision}))}catch{}}
function loadCachedLedger(){try{const cached=JSON.parse(localStorage.getItem(ledgerCacheKey)||'null');if(!cached||!Array.isArray(cached.state?.people)||!Array.isArray(cached.state?.expenses)||!Array.isArray(cached.state?.incomes))return false;state=cached.state;cloudRevision=Number(cached.revision||0);syncStatus('顯示上次同步資料 · 正在更新');return true}catch{return false}}
async function refreshCloud(){if(!window.SPREADSHEET_API_URL){syncStatus('尚未設定 Google Sheets 連線');return}if(cloudSaving||cloudRefreshing)return;cloudRefreshing=true;try{const response=await fetch(window.SPREADSHEET_API_URL,{cache:'no-store'});if(!response.ok)throw new Error('無法連線');const payload=await response.json();if(!cloudReady||payload.revision!==cloudRevision){state=payload.state;cloudRevision=payload.revision;settlementRequested=false;cacheLedger();render()}cloudReady=true;syncStatus('已同步 · 所有旅伴共用')}catch{syncStatus('連線失敗，請稍後重新整理')}finally{cloudRefreshing=false}}
function save(){if(!cloudReady){syncStatus('帳本尚未連線，請稍後重試');return}settlementRequested=false;render();cacheLedger();cloudSaving=true;syncStatus('畫面已更新 · 正在同步共用帳本…');fetch(window.SPREADSHEET_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({state,revision:cloudRevision})}).then(async response=>{if(!response.ok){const payload=await response.json();throw new Error(payload.error||'儲存失敗')}const payload=await response.json();if(payload.error)throw new Error(payload.error);cloudRevision=payload.revision;cacheLedger();cloudSaving=false;syncStatus('已同步 · 所有旅伴共用')}).catch(async error=>{cloudSaving=false;syncStatus(error.message);await refreshCloud();alert(error.message)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addPerson(name,note=''){name=name.trim();if(!name)return;if(state.people.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('這個名字已經存在');state.people.push({id:crypto.randomUUID(),name,note:note.trim()});save()}
function expensePayments(expense){return Array.isArray(expense.payments)&&expense.payments.length?expense.payments:[{personId:expense.payer,amount:expense.amount}]}
function removePerson(id){if(state.expenses.some(expense=>expensePayments(expense).some(payment=>payment.personId===id)||expense.split.includes(id))||(state.incomes||[]).some(income=>income.beneficiary===id||income.holder===id))return alert('這位旅伴已有收入或支出紀錄，請先刪除相關紀錄。');state.people=state.people.filter(p=>p.id!==id);save()}
function editPersonNote(id){const person=state.people.find(entry=>entry.id===id);if(!person)return;const note=prompt(`編輯 ${person.name} 的旅客備註`,person.note||'');if(note===null)return;person.note=note.trim().slice(0,120);save()}

 $('#expenses').innerHTML=state.expenses.length?state.expenses.slice().reverse().map(expense=>{const details=expense.split.map(id=>`${esc(names[id]||'已刪除')} ${money(expense.mode==='custom'&&expense.shares?Number(expense.shares[id]||0):expense.amount/expense.split.length)}`).join(' · '),payments=expensePayments(expense).map(payment=>`${esc(names[payment.personId]||'已刪除')} ${money(payment.amount)}`).join('、');return `<div class="expense"><div><strong><span class="category-badge">${esc(expense.category||'其他')}</span>${esc(expense.title)}</strong><div class="meta">付款：${payments} · ${expense.mode==='custom'?'自訂分攤':'平均分攤'}<div class="split-detail">分攤：${details}</div></div></div><div class="amount">${money(expense.amount)}<button type="button" class="secondary small" data-edit-expense="${expense.id}">編輯</button><button class="danger small" data-remove-expense="${expense.id}">刪除</button></div></div>`}).join(''):'<div class="empty">加入第一筆旅費吧</div>';
 const b=balances();$('#balances').innerHTML=state.people.length?state.people.map(p=>{const v=b[p.id],totals=personTotals(p.id);return `<button type="button" class="balance person-balance" data-person-detail="${p.id}" aria-label="查看 ${esc(p.name)} 的所有旅費明細"><div><strong>${esc(p.name)}</strong></div>${p.note?`<div class="person-note">${esc(p.note)}</div>`:''}<div class="person-breakdown"><span>分攤支出 ${money(totals.share)}</span><span>個人補助 ${money(totals.subsidy)}</span><span>已代墊 ${money(totals.paid)}</span><span>保管基金 ${money(totals.held)}</span><span>補助後負擔 ${totals.net<0?'剩餘 ':''}${money(Math.abs(totals.net))}</span></div><div class="num ${v>=0?'positive':'negative'}">${v>=0?'應收 ':'應付 '}${money(Math.abs(v))}</div><div class="detail-hint">點擊查看全部明細 →</div></button>`}).join(''):'<div class="empty">新增旅伴後顯示</div>';
 if(!settlementRequested){$('#settlements').innerHTML='<div class="empty">按上方按鈕，計算最少轉帳筆數與付款明細</div>'}else{const tx=settle(b);$('#settlements').innerHTML=tx.length?`<div class="meta" style="margin-bottom:8px">最佳結算：只需 ${tx.length} 筆轉帳</div>${tx.map((t,index)=>`<div class="transfer"><span>${index+1}. <b>${esc(names[t.from])}</b> <span class="arrow">付給</span> <b>${esc(names[t.to])}</b></span><strong>${money(t.amount)}</strong></div>`).join('')}`:`<div class="empty">${state.expenses.length||(state.incomes||[]).length?'目前已經結清，不需要轉帳 🎉':'目前沒有收入或支出紀錄'}</div>`}
 renderCustomSplits();
}
$('#personForm').addEventListener('submit',e=>{e.preventDefault();addPerson($('#personName').value,$('#personNote').value);$('#personName').value='';$('#personNote').value='';$('#personName').focus()});
function switchEntryTab(type){const people=type==='people',income=type==='income',expense=type==='expense';$('#peoplePanel').hidden=!people;$('#incomeForm').hidden=!income;$('#expenseForm').hidden=!expense;$('#peopleTab').setAttribute('aria-selected',String(people));$('#incomeTab').setAttribute('aria-selected',String(income));$('#expenseTab').setAttribute('aria-selected',String(expense))}
$('#peopleTab').addEventListener('click',()=>switchEntryTab('people'));
$('#incomeTab').addEventListener('click',()=>switchEntryTab('income'));
$('#expenseTab').addEventListener('click',()=>switchEntryTab('expense'));
$('#incomeForm').addEventListener('submit',e=>{e.preventDefault();if(!state.people.length)return alert('請先新增旅伴');const amount=parseAmount($('#incomeAmount').value);if(!Number.isFinite(amount)||amount<=0)return alert('請輸入大於零的補助金額');state.incomes.push({id:crypto.randomUUID(),title:$('#incomeTitle').value.trim(),amount,beneficiary:$('#beneficiary').value,holder:$('#holder').value});e.target.reset();save()});
$('#expenseForm').addEventListener('submit',e=>{e.preventDefault();const split=selectedPeople();if(!state.people.length)return alert('請先新增旅伴');if(!split.length)return alert('請至少選擇一位分攤者');const amount=parseAmount($('#amount').value);if(!Number.isFinite(amount)||amount<=0)return alert('請輸入大於零的支出金額');let payments=payerEntries();if(!payments.length||payments.some(payment=>!payment.personId))return alert('請至少選擇一位付款人');if(payments.length===1&&!payments[0].raw)payments[0].amount=amount;if(payments.some(payment=>!Number.isFinite(payment.amount)||payment.amount<=0))return alert('請輸入每位付款人大於零的付款金額');if(new Set(payments.map(payment=>payment.personId)).size!==payments.length)return alert('同一位付款人只能選擇一次');if(Math.round(payments.reduce((sum,payment)=>sum+payment.amount,0)*100)!==Math.round(amount*100))return alert(`所有付款人金額加總必須等於支出總額 ${money(amount)}`);payments=payments.map(({personId,amount})=>({personId,amount}));const mode=$('#splitMode').value,expense={id:crypto.randomUUID(),title:$('#title').value.trim(),category:$('#expenseCategory').value||'其他',amount,payer:payments[0].personId,payments,split,mode};if(mode==='custom'){const inputs=[...document.querySelectorAll('[data-share-id]')];if(inputs.some(input=>input.value===''||parseAmount(input.value)<0))return alert('請填寫每位參與者的分攤金額');const shares=Object.fromEntries(inputs.map(input=>[input.dataset.shareId,parseAmount(input.value)])),assigned=Object.values(shares).reduce((sum,value)=>sum+value,0);if(Math.round(assigned*100)!==Math.round(amount*100))return alert(`每人金額加總必須等於支出總額 ${money(amount)}`);expense.shares=shares}state.expenses.push(expense);e.target.reset();renderPayerRows([{personId:state.people[0]?.id||'',amount:''}]);save()});
$('#splitMode').addEventListener('change',renderCustomSplits);
$('#splitPeople').addEventListener('change',renderCustomSplits);
$('#customSplits').addEventListener('input',event=>{if(event.target.dataset.shareId)formatAmountInput(event.target);updateSplitStatus()});
$('#amount').addEventListener('input',event=>{formatAmountInput(event.target);updateSplitStatus();updatePayerStatus()});
$('#incomeAmount').addEventListener('input',event=>formatAmountInput(event.target));
$('#payerRows').addEventListener('input',event=>{if(event.target.dataset.payerAmount!==undefined)formatAmountInput(event.target);updatePayerStatus()});
$('#payerRows').addEventListener('change',updatePayerStatus);
$('#addPayerBtn').addEventListener('click',addPayerRow);
$('#addCategoryBtn').addEventListener('click',addExpenseCategory);
$('#editExpenseForm').addEventListener('submit',saveEditedExpense);
$('#closeEditExpenseBtn').addEventListener('click',closeExpenseEditor);
$('#closePersonDetailBtn').addEventListener('click',closePersonDetail);
$('#editExpenseAmount').addEventListener('input',event=>{formatAmountInput(event.target);updateEditPayerStatus();updateEditSplitStatus()});
$('#editPayerRows').addEventListener('input',event=>{if(event.target.dataset.editPayerAmount!==undefined)formatAmountInput(event.target);updateEditPayerStatus()});
$('#editPayerRows').addEventListener('change',updateEditPayerStatus);
$('#editAddPayerBtn').addEventListener('click',()=>{const current=editPayerEntries().map(entry=>({personId:entry.personId,amount:entry.raw})),unused=state.people.find(person=>!current.some(entry=>entry.personId===person.id));if(!unused)return alert('所有旅伴都已加入付款人');current.push({personId:unused.id,amount:''});renderEditPayerRows(current)});
$('#editSplitMode').addEventListener('change',()=>renderEditCustomSplits());
$('#editSplitPeople').addEventListener('change',()=>renderEditCustomSplits());
$('#editCustomSplits').addEventListener('input',event=>{if(event.target.dataset.editShareId)formatAmountInput(event.target);updateEditSplitStatus()});
function openSettlement(){settlementRequested=true;render();$('#settlementScreen').hidden=false}
function closeSettlement(){$('#settlementScreen').hidden=true}
function openCharts(){render();$('#chartsScreen').hidden=false}
function closeCharts(){$('#chartsScreen').hidden=true}
$('#calculateBtn').addEventListener('click',openSettlement);
$('#closeSettlementBtn').addEventListener('click',closeSettlement);
$('#openChartsBtn').addEventListener('click',openCharts);
$('#closeChartsBtn').addEventListener('click',closeCharts);
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closePersonDetail();closeSettlement();closeCharts();closeExpenseEditor()}});
document.addEventListener('click',e=>{const p=e.target.dataset.removePerson,note=e.target.dataset.editPersonNote,x=e.target.dataset.removeExpense,income=e.target.dataset.removeIncome,removePayer=e.target.dataset.removePayer,edit=e.target.dataset.editExpense,removeEditPayer=e.target.dataset.editRemovePayer,detailTarget=e.target.closest?.('[data-person-detail]');if(detailTarget)openPersonDetail(detailTarget.dataset.personDetail);if(removePayer!==undefined)removePayerRow(Number(removePayer));if(removeEditPayer!==undefined){const current=editPayerEntries().map(entry=>({personId:entry.personId,amount:entry.raw}));current.splice(Number(removeEditPayer),1);renderEditPayerRows(current)}if(edit)openExpenseEditor(edit);if(note)editPersonNote(note);if(p)removePerson(p);if(x){state.expenses=state.expenses.filter(expense=>expense.id!==x);save()}if(income){state.incomes=state.incomes.filter(entry=>entry.id!==income);save()}});
$('#exportStatsBtn').addEventListener('click',()=>{const blob=new Blob([buildStatisticsCsv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='西班牙之旅花費統計.csv';a.click();URL.revokeObjectURL(a.href)});
loadCachedLedger();
render();
refreshCloud();
setInterval(()=>{if(!document.hidden)refreshCloud()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});
</script>
</body>
</html>
