<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>西班牙之旅｜個人票夾測試版</title>
<style>
:root{--red:#aa2836;--gold:#e9b54b;--ink:#302220;--muted:#766d68;--line:#e9ddd2;--cream:#fffaf2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8ec,#fff2d2 55%,#fff6ef);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:24px 18px 72px}header{padding:30px;border-radius:22px;background:linear-gradient(110deg,#a52333,#c93338 60%,#eab443);color:white;box-shadow:0 14px 32px #8d35402b}header h1{margin:0;font-size:clamp(26px,5vw,42px)}header p{margin:8px 0 0;opacity:.95}.flag{margin-right:10px}
.notice{margin:20px 0;padding:14px 17px;border:1px solid #e8bf65;border-radius:14px;background:#fff5db;line-height:1.6}.notice strong{color:#8b3a24}
.panel{background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 25px #8d503010}h2{margin:0 0 15px;font-size:23px}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.controls label{font-weight:700}.controls select{display:block;margin-top:6px;padding:12px 14px;border:1px solid #d9cabc;border-radius:12px;background:#fff;color:var(--ink);font:inherit;min-width:180px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.tab{border:1px solid var(--line);border-radius:999px;padding:10px 15px;background:#fff;color:var(--ink);font-weight:700}.tab[aria-selected=true]{background:var(--red);color:#fff;border-color:var(--red)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.metric{padding:10px 14px;background:#fff3df;border-radius:12px;font-size:14px}.metric b{font-size:18px;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.ticket{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 16px #582f1610}.ticket-head{padding:16px 18px;background:linear-gradient(100deg,#fff4dd,#fffbf4);border-bottom:1px dashed #d5b899}.ticket-kind{color:var(--red);font-size:13px;font-weight:800;letter-spacing:.04em}.ticket h3{margin:7px 0 5px;font-size:21px;overflow-wrap:anywhere}.ticket-date{font-weight:700}.ticket-body{display:grid;gap:9px;padding:16px 18px;flex:1}.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.row span:first-child{color:var(--muted)}.row strong{text-align:right;overflow-wrap:anywhere}.ticket-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}.status{padding:5px 9px;border-radius:999px;background:#e8f6ed;color:#256942;font-size:12px;font-weight:800}.status.used{background:#eeeae7;color:#665e5a}.status.shared{background:#fff0d6;color:#82580c}.detail-btn{border:0;border-radius:10px;background:var(--red);color:white;padding:9px 13px;font-weight:800;white-space:nowrap}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
dialog{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 28px);overflow:auto;border:0;border-radius:22px;padding:0;box-shadow:0 24px 70px #2d1b1b66}dialog::backdrop{background:#2c1c1c99}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:start;background:#fff1d6;padding:22px}.dialog-head h2{margin:0}.close{border:0;background:transparent;font-size:26px;line-height:1}.dialog-body{padding:22px}.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.detail-grid span{color:var(--muted)}.qr-placeholder{margin:22px 0;padding:28px;text-align:center;border:2px dashed #d5b899;border-radius:16px;background:#fffcf5;color:#765c3d}.qr-placeholder strong{display:block;font-size:19px;margin-bottom:6px}.privacy{font-size:13px;color:var(--muted);line-height:1.6}.back{display:inline-block;margin-top:20px;color:var(--red);font-weight:700;text-decoration:none}
@media(max-width:680px){.grid{grid-template-columns:1fr}.tabs{margin-left:0;width:100%}.tab{flex:1;padding:10px 7px}.controls label,.controls select{width:100%}header{padding:24px}.panel{padding:17px}.detail-grid{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><h1><span class="flag" aria-hidden="true">🇪🇸</span>西班牙之旅・個人票夾</h1><p>依旅伴查看各自的個人票券與使用資訊</p></header>
<div class="notice" role="note"><strong>畫面測試版</strong>　以下皆為示範票券，沒有真實 QR Code、訂位碼或票券檔案。此頁網址可公開開啟，切換旅伴只是畫面預覽，<strong>不是登入或權限保護</strong>。</div>
<section class="panel" aria-labelledby="walletTitle"><h2 id="walletTitle">我的票夾</h2><div class="controls"><label for="personSelect">預覽旅伴<select id="personSelect"><option value="a">示範旅伴 A</option><option value="b">示範旅伴 B</option><option value="c">示範旅伴 C</option></select></label><div class="tabs" role="tablist" aria-label="票券狀態"><button class="tab" role="tab" aria-selected="true" data-filter="upcoming">待使用</button><button class="tab" role="tab" aria-selected="false" data-filter="all">全部</button><button class="tab" role="tab" aria-selected="false" data-filter="used">已使用</button></div></div><div class="summary" id="summary"></div><div class="grid" id="tickets"></div></section>
<a class="back" href="./firebase-test.html">← 返回電子行程測試版</a>
</main>
<dialog id="ticketDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div><div class="ticket-kind" id="dialogKind"></div><h2 id="dialogTitle"></h2></div><button class="close" id="closeDialog" type="button" aria-label="關閉">×</button></div><div class="dialog-body" id="dialogBody"></div></dialog>
<script>
const tickets=[
{id:'t1',kind:'景點門票',title:'聖家堂入場券',date:'10/8',time:'09:30',place:'巴塞隆納',person:'a',status:'upcoming',note:'請依票面指定時段入場。'},
{id:'t2',kind:'交通票',title:'馬德里 → 巴塞隆納高鐵',date:'10/7',time:'08:40',place:'馬德里車站',person:'a',status:'upcoming',note:'實際搭乘時間以正式票券為準。'},
{id:'t3',kind:'景點門票',title:'巴特略之家入場券',date:'10/9',time:'14:00',place:'巴塞隆納',person:'b',status:'upcoming',note:'入場前請確認實際票券。'},
{id:'t4',kind:'交通票',title:'塞維亞來回車票',date:'10/4',time:'10:00',place:'馬德里車站',person:'c',status:'used',note:'示範已使用狀態。'},
{id:'t5',kind:'景點門票',title:'奎爾公園入場券',date:'10/8',time:'16:00',place:'巴塞隆納',person:'c',status:'upcoming',note:'請依票面指定時段入場。'}
];const names={a:'示範旅伴 A',b:'示範旅伴 B',c:'示範旅伴 C'};let filter='upcoming';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function render(){const person=$('#personSelect').value,mine=tickets.filter(t=>t.person===person),shown=mine.filter(t=>filter==='all'||t.status===filter);$('#summary').innerHTML='<div class="metric">我的票券 <b>'+mine.length+'</b> 張</div><div class="metric">待使用 <b>'+mine.filter(t=>t.status==='upcoming').length+'</b> 張</div><div class="metric">已使用 <b>'+mine.filter(t=>t.status==='used').length+'</b> 張</div>';$('#tickets').innerHTML=shown.length?shown.map(t=>'<article class="ticket"><div class="ticket-head"><div class="ticket-kind">'+esc(t.kind)+'</div><h3>'+esc(t.title)+'</h3><div class="ticket-date">'+esc(t.date)+' · '+esc(t.time)+'</div></div><div class="ticket-body"><div class="row"><span>持票旅伴</span><strong>'+esc(names[t.person])+'</strong></div><div class="row"><span>地點</span><strong>'+esc(t.place)+'</strong></div></div><div class="ticket-foot"><span class="status '+(t.status==='used'?'used':'')+'">'+(t.status==='used'?'已使用':'待使用')+'</span><button type="button" class="detail-btn" data-ticket="'+t.id+'">查看票券資訊</button></div></article>').join(''):'<div class="empty">這個分類目前沒有票券</div>'}
$('#personSelect').addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()}));
$('#tickets').addEventListener('click',e=>{const id=e.target.closest('[data-ticket]')?.dataset.ticket;if(!id)return;const t=tickets.find(x=>x.id===id);$('#dialogKind').textContent=t.kind;$('#dialogTitle').textContent=t.title;$('#dialogBody').innerHTML='<div class="detail-grid"><span>日期時間</span><strong>'+esc(t.date+' '+t.time)+'</strong></div><div class="detail-grid"><span>地點</span><strong>'+esc(t.place)+'</strong></div><div class="detail-grid"><span>持票旅伴</span><strong>'+esc(names[t.person])+'</strong></div><div class="detail-grid"><span>提醒</span><strong>'+esc(t.note)+'</strong></div><div class="qr-placeholder"><strong>票券／QR Code 預留位置</strong>測試版沒有上傳真實票券</div><p class="privacy">正式版需要登入驗證，且由伺服器檢查持票人權限後才能讀取票券。只在畫面上切換旅伴不具備保護作用。</p>';$('#ticketDialog').showModal()});$('#closeDialog').addEventListener('click',()=>$('#ticketDialog').close());render();
</script>
</body>
</html>
