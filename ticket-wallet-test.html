<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>西班牙之旅｜個人票夾測試版</title>
<style>
:root{--red:#aa2836;--gold:#e9b54b;--ink:#302220;--muted:#766d68;--line:#e9ddd2;--cream:#fffaf2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8ec,#fff2d2 55%,#fff6ef);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:24px 18px 72px}header{padding:30px;border-radius:22px;background:linear-gradient(110deg,#a52333,#c93338 60%,#eab443);color:white;box-shadow:0 14px 32px #8d35402b}header h1{margin:0;font-size:clamp(26px,5vw,42px)}header p{margin:8px 0 0;opacity:.95}.flag{margin-right:10px}
.notice{margin:20px 0;padding:14px 17px;border:1px solid #e8bf65;border-radius:14px;background:#fff5db;line-height:1.6}.notice strong{color:#8b3a24}
.panel{background:#fffdf9;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 25px #8d503010}h2{margin:0 0 15px;font-size:23px}
.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.controls label{font-weight:700}.controls select{display:block;margin-top:6px;padding:12px 14px;border:1px solid #d9cabc;border-radius:12px;background:#fff;color:var(--ink);font:inherit;min-width:180px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.tab{border:1px solid var(--line);border-radius:999px;padding:10px 15px;background:#fff;color:var(--ink);font-weight:700}.tab[aria-selected=true]{background:var(--red);color:#fff;border-color:var(--red)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.metric{padding:10px 14px;background:#fff3df;border-radius:12px;font-size:14px}.metric b{font-size:18px;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.ticket{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 16px #582f1610}.ticket-head{padding:16px 18px;background:linear-gradient(100deg,#fff4dd,#fffbf4);border-bottom:1px dashed #d5b899}.ticket-kind{color:var(--red);font-size:13px;font-weight:800;letter-spacing:.04em}.ticket h3{margin:7px 0 5px;font-size:21px;overflow-wrap:anywhere}.ticket-date{font-weight:700}.ticket-body{display:grid;gap:9px;padding:16px 18px;flex:1}.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.row span:first-child{color:var(--muted)}.row strong{text-align:right;overflow-wrap:anywhere}.ticket-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}.status{padding:5px 9px;border-radius:999px;background:#e8f6ed;color:#256942;font-size:12px;font-weight:800}.status.used{background:#eeeae7;color:#665e5a}.status.shared{background:#fff0d6;color:#82580c}.detail-btn{border:0;border-radius:10px;background:var(--red);color:white;padding:9px 13px;font-weight:800;white-space:nowrap}.empty{padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
dialog{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 28px);overflow:auto;border:0;border-radius:22px;padding:0;box-shadow:0 24px 70px #2d1b1b66}dialog::backdrop{background:#2c1c1c99}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:start;background:#fff1d6;padding:22px}.dialog-head h2{margin:0}.close{border:0;background:transparent;font-size:26px;line-height:1}.dialog-body{padding:22px}.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.detail-grid span{color:var(--muted)}.qr-placeholder{margin:22px 0;padding:28px;text-align:center;border:2px dashed #d5b899;border-radius:16px;background:#fffcf5;color:#765c3d}.qr-placeholder strong{display:block;font-size:19px;margin-bottom:6px}.privacy{font-size:13px;color:var(--muted);line-height:1.6}.back{display:inline-block;margin-top:20px;color:var(--red);font-weight:700;text-decoration:none}
@media(max-width:680px){.grid{grid-template-columns:1fr}.tabs{margin-left:0;width:100%}.tab{flex:1;padding:10px 7px}.controls label,.controls select{width:100%}header{padding:24px}.panel{padding:17px}.detail-grid{grid-template-columns:90px 1fr}}
.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.person-button{display:flex;align-items:center;gap:12px;text-align:left;background:#fff8eb;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}.person-button span:nth-child(2){flex:1}.person-button strong,.person-button small{display:block}.person-button small{color:var(--muted);margin-top:4px}.person-avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#efc36a;color:#672e25;font-weight:900}.back-button{border:0;background:none;color:var(--red);font-weight:800;padding:0;margin-bottom:16px}.sub{color:var(--muted);margin:0 0 18px;line-height:1.6}.ticket-form{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff9ef;margin:20px 0}.ticket-form h3{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-weight:700}.form-grid input,.form-grid select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d8c8b7;border-radius:10px;background:#fff;font:inherit}.delete-btn{border:0;background:#fff1f1;color:#a82e3b;padding:9px 13px;border-radius:10px;font-weight:800}.ticket-preview-image{display:block;max-width:100%;max-height:70vh;margin:auto}.ticket-preview-pdf{display:block;width:100%;height:65vh;border:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:680px){.people-grid,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><h1><span class="flag" aria-hidden="true">🇪🇸</span>西班牙之旅・個人票夾</h1><p>依旅伴查看各自的個人票券與使用資訊</p></header>
<div class="notice" role="note"><strong>畫面測試版</strong>　此頁網址可公開開啟，旅伴姓名只是示範。選取的檔案僅儲存在目前裝置的瀏覽器，不會同步到其他人；切換旅伴<strong>不是登入或權限保護</strong>。</div>
<section class="panel" aria-labelledby="walletTitle"><div id="peopleView"><h2 id="walletTitle">選擇旅伴</h2><p class="sub">點名字，進入那位旅伴的個人票夾。</p><div class="people-grid" id="peopleGrid"></div></div><div id="personView" hidden><button type="button" class="back-button" id="backToPeople">← 返回旅伴名單</button><h2 id="personTitle"></h2><p class="sub">這個人的票券會保存在目前裝置的瀏覽器中。其他裝置或旅伴不會自動看到。</p><div class="summary" id="summary"></div><form id="ticketForm" class="ticket-form"><h3>儲存個人票券</h3><div class="form-grid"><label>票券名稱<input id="ticketTitle" required maxlength="80" placeholder="例如：聖家堂門票"></label><label>日期<input id="ticketDate" type="date"></label><label>類型<select id="ticketKind"><option>景點門票</option><option>交通票</option><option>住宿憑證</option><option>其他</option></select></label><label>票券檔案<input id="ticketFile" type="file" accept="application/pdf,image/*" required></label></div><p class="privacy">可選 PDF 或圖片。測試版只存在這台裝置；請保留原檔作備份。建議單一檔案不超過 20 MB。</p><button type="submit" class="detail-btn">儲存到此人的票夾</button><span id="saveStatus" role="status"></span></form><h3>已儲存票券</h3><div class="grid" id="tickets"></div></div></section>
<a class="back" href="./firebase-test.html">← 返回電子行程測試版</a>
</main>
<dialog id="ticketDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div><div class="ticket-kind" id="dialogKind"></div><h2 id="dialogTitle"></h2></div><button class="close" id="closeDialog" type="button" aria-label="關閉">×</button></div><div class="dialog-body"><p id="dialogMeta"></p><div id="previewArea"></div><p class="privacy">這是目前裝置上的票券副本。請勿只依賴瀏覽器儲存，原檔仍需備份。</p></div></dialog>
<script>
const people=['示範旅伴 A','示範旅伴 B','示範旅伴 C'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let currentPerson=null,db=null,previewUrl=null;
function openDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open('spain-trip-ticket-wallet-test',1);request.onupgradeneeded=()=>{request.result.createObjectStore('tickets',{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function readAll(){return new Promise((resolve,reject)=>{const r=db.transaction('tickets').objectStore('tickets').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function putTicket(ticket){return new Promise((resolve,reject)=>{const r=db.transaction('tickets','readwrite').objectStore('tickets').put(ticket);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function removeTicket(id){return new Promise((resolve,reject)=>{const r=db.transaction('tickets','readwrite').objectStore('tickets').delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function renderPeople(counts={}){$('#peopleGrid').innerHTML=people.map((name,i)=>'<button type="button" class="person-button" data-person="'+i+'"><span class="person-avatar">'+esc(name.slice(-1))+'</span><span><strong>'+esc(name)+'</strong><small>'+Number(counts[i]||0)+' 張票券</small></span><span aria-hidden="true">→</span></button>').join('')}
async function refresh(){const all=await readAll(),counts={};for(const ticket of all)counts[ticket.person]=(counts[ticket.person]||0)+1;renderPeople(counts);if(currentPerson===null)return;const mine=all.filter(t=>t.person===currentPerson).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));$('#summary').innerHTML='<div class="metric">已儲存 <b>'+mine.length+'</b> 張個人票券</div>';$('#tickets').innerHTML=mine.length?mine.map(t=>'<article class="ticket"><div class="ticket-head"><div class="ticket-kind">'+esc(t.kind)+'</div><h3>'+esc(t.title)+'</h3><div class="ticket-date">'+esc(t.date||'未填日期')+'</div></div><div class="ticket-body"><div class="row"><span>持票旅伴</span><strong>'+esc(people[t.person])+'</strong></div><div class="row"><span>檔案</span><strong>'+esc(t.fileName)+'</strong></div></div><div class="ticket-foot"><button type="button" class="detail-btn" data-open="'+esc(t.id)+'">查看票券</button><button type="button" class="delete-btn" data-delete="'+esc(t.id)+'">刪除</button></div></article>').join(''):'<div class="empty">目前沒有票券。可在上方選擇 PDF 或圖片儲存到這個人的票夾。</div>'}
$('#peopleGrid').addEventListener('click',event=>{const i=event.target.closest('[data-person]')?.dataset.person;if(i===undefined)return;currentPerson=Number(i);$('#peopleView').hidden=true;$('#personView').hidden=false;$('#personTitle').textContent=people[currentPerson]+'的票夾';refresh()});
$('#backToPeople').addEventListener('click',()=>{currentPerson=null;$('#personView').hidden=true;$('#peopleView').hidden=false;refresh()});
$('#ticketForm').addEventListener('submit',async event=>{event.preventDefault();if(currentPerson===null)return;const file=$('#ticketFile').files[0];if(!file)return;if(file.size>20*1024*1024){$('#saveStatus').textContent='檔案超過 20 MB，請先壓縮或保留原檔。';return}if(file.type!=='application/pdf'&&!file.type.startsWith('image/')){$('#saveStatus').textContent='請選擇 PDF 或圖片。';return}const button=event.submitter;button.disabled=true;$('#saveStatus').textContent='儲存中…';try{await putTicket({id:crypto.randomUUID(),person:currentPerson,title:$('#ticketTitle').value.trim(),date:$('#ticketDate').value,kind:$('#ticketKind').value,fileName:file.name,mime:file.type,blob:file,createdAt:Date.now()});$('#ticketForm').reset();$('#saveStatus').textContent='已存到目前裝置。';await refresh()}catch(error){$('#saveStatus').textContent='儲存失敗；可能是瀏覽器空間不足。';console.error(error)}finally{button.disabled=false}});
$('#tickets').addEventListener('click',async event=>{const open=event.target.closest('[data-open]')?.dataset.open,del=event.target.closest('[data-delete]')?.dataset.delete;if(!open&&!del)return;const all=await readAll(),ticket=all.find(t=>t.id===(open||del)&&t.person===currentPerson);if(!ticket)return;if(del){if(!confirm('確定刪除「'+ticket.title+'」的瀏覽器副本？原始檔不受影響。'))return;await removeTicket(ticket.id);refresh();return}if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(ticket.blob);$('#dialogKind').textContent=ticket.kind;$('#dialogTitle').textContent=ticket.title;$('#dialogMeta').textContent=(ticket.date||'未填日期')+' · '+people[ticket.person];$('#previewArea').innerHTML=ticket.mime.startsWith('image/')?'<img class="ticket-preview-image" alt="票券圖片" src="'+previewUrl+'">':'<iframe class="ticket-preview-pdf" title="個人票券 PDF" src="'+previewUrl+'"></iframe>';$('#ticketDialog').showModal()});
$('#closeDialog').addEventListener('click',()=>$('#ticketDialog').close());$('#ticketDialog').addEventListener('close',()=>{if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}$('#previewArea').replaceChildren()});
openDb().then(result=>{db=result;refresh()}).catch(error=>{$('#peopleGrid').innerHTML='<div class="empty">這個瀏覽器無法儲存票券。請改用一般瀏覽模式。</div>';console.error(error)});
</script>
</body>
</html>
